<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1f26"/>
      <stop offset="0.55" stop-color="#121214"/>
      <stop offset="1" stop-color="#0b0b0c"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- window: theme gradient under tinted glass -->
  <rect width="320" height="200" fill="url(#glass)"/>
  <rect width="320" height="200" fill="url(#sheen)"/>

  <!-- left sidebar: spaces, then agents -->
  <g>
    <rect x="8" y="10" width="34" height="3" rx="1.5" fill="#d4d4d8" opacity="0.55"/>
    <rect x="6" y="20" width="44" height="9" rx="3" fill="#ffffff" opacity="0.05"/>
    <rect x="9" y="22.5" width="4" height="4" rx="1" fill="#2fb48a"/>
    <rect x="16" y="23.5" width="22" height="2" rx="1" fill="#d4d4d8" opacity="0.6"/>
    <rect x="6" y="31" width="44" height="9" rx="3" fill="#4c9df3" opacity="0.22"/>
    <rect x="9" y="33.5" width="4" height="4" rx="1" fill="#e5774a"/>
    <rect x="16" y="34.5" width="20" height="2" rx="1" fill="#e6e6ea"/>

    <rect x="8" y="104" width="18" height="2" rx="1" fill="#d4d4d8" opacity="0.45"/>
    <circle cx="11" cy="115" r="2.6" fill="#f05454"/>
    <rect x="16" y="113.5" width="26" height="2" rx="1" fill="#d4d4d8" opacity="0.6"/>
    <rect x="6" y="122" width="44" height="10" rx="3" fill="#4c9df3" opacity="0.18"/>
    <circle cx="11" cy="127" r="2.6" fill="#e0b450"/>
    <rect x="16" y="125.5" width="24" height="2" rx="1" fill="#e6e6ea"/>
    <circle cx="11" cy="139" r="2.6" fill="#8b8b93"/>
    <rect x="16" y="137.5" width="22" height="2" rx="1" fill="#d4d4d8" opacity="0.6"/>
  </g>

  <!-- toolbar: segmented tabs and search -->
  <rect x="60" y="6" width="38" height="9" rx="4.5" fill="#ffffff" opacity="0.07"/>
  <rect x="62" y="8" width="17" height="5" rx="2.5" fill="#ffffff" opacity="0.12"/>
  <rect x="160" y="6" width="44" height="9" rx="4.5" fill="#ffffff" opacity="0.07"/>

  <!-- terminal: a solid card on the glass, focus ring in the accent -->
  <rect x="57" y="20" width="155" height="170" rx="5" fill="#151517" stroke="#4c9df3" stroke-opacity="0.75" stroke-width="1"/>
  <rect x="64" y="26" width="5" height="3" rx="1" fill="#e5774a"/>
  <rect x="72" y="26.5" width="40" height="2" rx="1" fill="#d4d4d8" opacity="0.55"/>
  <g fill="#c8c8ce">
    <rect x="64" y="40" width="70" height="2" rx="1" opacity="0.8"/>
    <rect x="64" y="50" width="96" height="2" rx="1" opacity="0.5"/>
    <rect x="64" y="56" width="110" height="2" rx="1" opacity="0.5"/>
    <rect x="64" y="62" width="84" height="2" rx="1" opacity="0.5"/>
    <rect x="64" y="68" width="76" height="2" rx="1" opacity="0.5"/>
  </g>
  <!-- the Send paste: @paths waiting in the prompt -->
  <rect x="64" y="80" width="3" height="2" rx="1" fill="#c8c8ce"/>
  <rect x="70" y="80" width="56" height="2" rx="1" fill="#4c9df3" opacity="0.9"/>
  <rect x="130" y="80" width="44" height="2" rx="1" fill="#4c9df3" opacity="0.9"/>
  <rect x="70" y="86" width="50" height="2" rx="1" fill="#4c9df3" opacity="0.9"/>
  <rect x="123" y="85" width="2" height="4" fill="#e6e6ea"/>

  <!-- Notes sidebar: vault tree, local graph, linked notes -->
  <rect x="220" y="0" width="100" height="200" fill="#ffffff" opacity="0.025"/>
  <rect x="226" y="9" width="22" height="3" rx="1.5" fill="#e6e6ea" opacity="0.8"/>
  <g>
    <rect x="228" y="20" width="5" height="4" rx="1" fill="#4c9df3" opacity="0.7"/>
    <rect x="236" y="21" width="24" height="2" rx="1" fill="#d4d4d8" opacity="0.6"/>
    <rect x="228" y="28" width="5" height="4" rx="1" fill="#4c9df3" opacity="0.7"/>
    <rect x="236" y="29" width="18" height="2" rx="1" fill="#d4d4d8" opacity="0.6"/>
    <rect x="228" y="36" width="5" height="4" rx="1" fill="#4c9df3" opacity="0.7"/>
    <rect x="236" y="37" width="28" height="2" rx="1" fill="#d4d4d8" opacity="0.6"/>
    <rect x="228" y="44" width="5" height="4" rx="1" fill="#4c9df3" opacity="0.7"/>
    <rect x="236" y="45" width="22" height="2" rx="1" fill="#d4d4d8" opacity="0.6"/>
  </g>

  <rect x="220" y="104" width="100" height="0.6" fill="#ffffff" opacity="0.08"/>
  <g stroke="#8b8b93" stroke-opacity="0.55" stroke-width="0.8">
    <line x1="270" y1="118" x2="270" y2="138"/>
    <line x1="270" y1="118" x2="246" y2="148"/>
    <line x1="270" y1="118" x2="296" y2="148"/>
    <line x1="270" y1="138" x2="246" y2="148"/>
    <line x1="270" y1="138" x2="296" y2="148"/>
  </g>
  <circle cx="270" cy="118" r="2.6" fill="none" stroke="#4c9df3" stroke-width="1"/>
  <circle cx="270" cy="138" r="3.6" fill="#4c9df3"/>
  <circle cx="246" cy="148" r="2.2" fill="none" stroke="#a1a1aa" stroke-width="0.8"/>
  <circle cx="296" cy="148" r="2.4" fill="#a1a1aa"/>

  <rect x="226" y="166" width="22" height="7" rx="3.5" fill="#ffffff" opacity="0.1"/>
  <rect x="251" y="166" width="22" height="7" rx="3.5" fill="#ffffff" opacity="0.1"/>
  <rect x="276" y="166" width="26" height="7" rx="3.5" fill="#4c9df3" opacity="0.25"/>
  <rect x="226" y="177" width="30" height="7" rx="3.5" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="0.8"/>
</svg>
